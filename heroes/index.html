<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>v3: варианты главного экрана</title>
<style>body{margin:0;padding:24px;background:hsl(220 10% 95%);font:15px/1.5 system-ui,sans-serif;color:hsl(222 30% 12%)}h1{font-size:20px;margin:0 0 4px}.i{color:hsl(222 8% 42%);margin:0 0 20px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(560px,1fr));gap:24px}figure{margin:0;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 4px 16px hsl(222 30% 20% / .08)}.f{position:relative;aspect-ratio:1440/900;overflow:hidden}.f iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0}figcaption{padding:14px 16px;display:flex;justify-content:space-between;gap:16px}figcaption p{margin:2px 0 0;color:hsl(222 8% 42%);font-size:14px}figcaption a{color:hsl(226 80% 45%);font-weight:600;text-decoration:none;white-space:nowrap}</style></head><body>
<h1>Три новых главных экрана для v3</h1><p class="i">Анимации живые. Откройте на весь экран: в C нужно прокрутить вниз, в B можно листать объекты стрелками.</p>
<div class="g">
<figure><div class="f"><iframe src="a-words.html"></iframe></div><figcaption><div><b>A. Слова и фото</b><p>Огромный заголовок, в строки вставлены капсулы с фото. Одна капсула сама переключается «до/после».</p></div><a href="a-words.html" target="_blank">На весь экран</a></figcaption></figure>
<figure><div class="f"><iframe src="b-deck.html"></iframe></div><figcaption><div><b>B. Колода объектов</b><p>Справа стопка карточек-объектов. Верхняя показывает «до/после», потом улетает, и выходит следующая.</p></div><a href="b-deck.html" target="_blank">На весь экран</a></figcaption></figure>
<figure><div class="f"><iframe src="c-pano.html"></iframe></div><figcaption><div><b>C. Панорама</b><p>Под заголовком широкий кадр «до/после», линия сама открывает результат. При прокрутке кадр раскрывается на весь экран.</p></div><a href="c-pano.html" target="_blank">На весь экран</a></figcaption></figure>
</div><script>const fit=()=>document.querySelectorAll('.f').forEach(f=>f.querySelector('iframe').style.transform=`scale(${f.clientWidth/1440})`);addEventListener('resize',fit);fit();</script></body></html>
